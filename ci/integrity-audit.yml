name: DINGO Cluster Continuous Integrity & Jules Sentinel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every 6 hours (24/7 background sentinel without token waste)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  cluster-integrity-check:
    name: Cluster Schema & Dispatcher Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Integrity & Regression Test Suite
        run: |
          python -m unittest tests/test_cluster_integrity.py -v

      - name: Static Shell Syntax Audit
        run: |
          bash -n scripts/hub-terminal-dispatch.sh
          echo "✔ Shell syntax check passed."
